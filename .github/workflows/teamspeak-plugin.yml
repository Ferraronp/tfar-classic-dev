name: Сборка TeamSpeak-плагина

on:
  pull_request:
  push:
    branches:
      - classic
    paths:
      - "ts/**"
      - "scripts/build-teamspeak-plugin.ps1"
      - ".github/workflows/teamspeak-plugin.yml"
      - "BUILDING.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: teamspeak-plugin-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protocol-tests:
    name: Parser protocol v1/v2
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Получить исходники протокола
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          lfs: false
          sparse-checkout: |
            ts
          sparse-checkout-cone-mode: true

      - name: Собрать и запустить parser-тесты
        run: |
          g++ -std=c++11 -Wall -Wextra -pedantic -Werror ts/tests/protocol_tests.cpp -o /tmp/tfar-protocol-tests
          /tmp/tfar-protocol-tests

  build:
    name: Win32, x64 и установщик
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Получить исходники без игровых LFS-объектов
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          lfs: false
          sparse-checkout: |
            scripts
            ts
          sparse-checkout-cone-mode: true

      - name: Собрать и проверить TeamSpeak-плагин
        shell: pwsh
        run: ./scripts/build-teamspeak-plugin.ps1

      - name: Опубликовать DLL и установщик
        uses: actions/upload-artifact@v7
        with:
          name: tfar-classic-teamspeak-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            dist/teamspeak-plugin/task_force_radio_win32.dll
            dist/teamspeak-plugin/task_force_radio_win64.dll
            dist/teamspeak-plugin/tfar-classic-api26.ts3_plugin
          if-no-files-found: error
          retention-days: 14
